<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Ruang Baca</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Ruang Baca</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Tentang</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Bantuan</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Form Login -->
    <div class="container">
        <div class="row justify-content-center align-items-center"
             style="min-height: 500px;">

            <div class="col-12 col-sm-10 col-md-6 col-lg-4">
                <div class="card shadow border-0">

                    <div class="card-body p-4">
                        <h4 class="text-center mb-1">
                            Masuk ke Ruang Baca
                        </h4>

                        <p class="text-center text-secondary small mb-4">
                            Temukan bacaan untuk hari ini.
                        </p>

                        <form>
                            <div class="mb-3">
                                <label class="form-label small">
                                    Username
                                </label>
                                <input type="text" class="form-control"
                                    placeholder="Masukkan username">
                            </div>

                            <div class="mb-3">
                                <label class="form-label small">
                                    Password
                                </label>
                                <input type="password" class="form-control"
                                    placeholder="Masukkan password">
                            </div>

                            <div class="form-check mb-3">
                                <input type="checkbox"
                                    class="form-check-input" id="ingat">
                                <label class="form-check-label small"
                                    for="ingat">
                                    Ingat saya
                                </label>
                            </div>

                            <button type="submit"
                                class="btn btn-success w-100">
                                Masuk
                            </button>
                        </form>
                    </div>

                    <div class="card-footer text-center py-3">
                        <a href="#" class="text-success small">
                            Lupa password?
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
